<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Transera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main>
    <form class="auth" action="dashboard.html">
      <p class="logo">🚐 Transera</p>
      <h1>Welcome back</h1>
      <p class="muted">Log in to book your next trip.</p>
      <label>Email<input type="email" placeholder="Ronquillojerome@gmail.com" autocomplete="email" required></label>
      <label>Password<input type="password" minlength="8" placeholder="Password" autocomplete="current-password" required></label>
      <p class="forgot"><a href="forgot-password.html">Forgot password?</a></p>
      <button class="btn" type="submit">Log in</button>
      <p class="muted center">Don't have an account? <a href="register.html">Sign up</a></p>
    </form>
  </main>
</body>
</html>
