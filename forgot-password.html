<!DOCTYPE html>

  <title>Transera</title>

<body class="auth-page">
  <main>
    <form class="auth" action="check-email.html">
      <p class="logo">🚐 Transera</p>

      <label>Email<input type="email" placeholder="Ronquillojerome@gmail.com" autocomplete="email" required></label>
      <button class="btn" type="submit">Send reset link</button>
      <p class="muted center"><a href="login.html">← Back to log in</a></p>
    </form>
  </main>
</body>
</html>
