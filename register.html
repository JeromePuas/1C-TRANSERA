<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main>
    <form class="auth" action="dashboard.html">
      <p class="logo">🚐 Transera</p>
      <h1>Create your account</h1>
      <label>Full name<input type="text" placeholder="Jerome Ronquillo" autocomplete="name" required></label>
      <label>Mobile number<input type="tel" placeholder="09XXXXXXXXX" autocomplete="tel" required></label>
      <label>Email<input type="email" placeholder="RonquilloJerome@gmail.com" autocomplete="email" required></label>
      <label>Password<input type="password" minlength="8" placeholder="Password" autocomplete="new-password" required></label>
      <button class="btn" type="submit">Sign up</button>
      <p class="muted center">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>
</body>
</html>
